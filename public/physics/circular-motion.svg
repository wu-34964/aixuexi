  <circle cx="230" cy="160" r="105" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="230" cy="160" r="5" fill="#0f172a"/>
  <circle cx="304" cy="86" r="10" fill="#ef4444"/>
